<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 150 1084 542"
     width="1024" height="512" font-family="Georgia, 'Times New Roman', serif"
     fill="#ffd100" role="img" aria-label="Das Verlies: schematischer Stilentwurf für DungeonManager, Vanilla. Nicht maßstabsgetreu; nicht zur Positionsanzeige geeignet." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Eigenständiger Stilentwurf. Keine kalibrierten Spielkoordinaten.
       Raumverbindungen nach Vanilla-Referenz; Maße und Winkel vereinfacht.
       Suchmarker 1 und 2 bezeichnen keine festen Spawnpunkte.
       6 ist ein Hinweis ohne räumliche Zuordnung.
       Geometrie, Marker und Legende sind über IDs separat ansprechbar. -->

<rect x="-30" y="150" width="1084" height="542" fill="#17130d"/>
  <path d="M48 120 H976" stroke="#c7a14a" fill="none"/>

  <!-- Zusammenhängende Bodenfläche mit offenen Durchgängen.
       Hauptgang: fünf Zellen. Je Flügel: vier Gangzellen,
       eine Endhalle und drei daran angeschlossene Zellen. -->
  <path id="floor-plan" fill="#3b3021" stroke="#c7a14a" stroke-width="3"
        stroke-linejoin="round" d="
    M488 680 V574 H468 V586 H408 V518 H468 V542 H488
    V488 H468 V500 H408 V432 H468 V456 H488 V346
    H388 V362 H406 V418 H350 V362 H368 V346
    H308 V362 H326 V418 H270 V362 H288 V346
    H234 V350 L210 374 H190 V390 H206 V446 H154 V390 H170 V374
    H150 L126 350 V334 H110 V350 H64 V298 H110 V314 H126 V298
    L150 274 H170 V258 H154 V202 H206 V258 H190 V274 H210 L234 298 V302
    H288 V286 H270 V230 H326 V286 H308 V302
    H368 V286 H350 V230 H406 V286 H388 V302
    H488 V274 H502 V258 H482 V202 H542 V258 H522 V274 H536 V302
    H636 V286 H618 V230 H674 V286 H654 V302
    H716 V286 H698 V230 H754 V286 H736 V302
    H790 V298 L814 274 H834 V258 H818 V202 H870 V258 H854 V274
    H874 L898 298 V314 H914 V298 H960 V350 H914 V334 H898 V350
    L874 374 H854 V390 H870 V446 H818 V390 H834 V374 H814 L790 350 V346
    H736 V362 H754 V418 H698 V362 H716 V346
    H654 V362 H674 V418 H618 V362 H636 V346 H536
    V456 H556 V432 H616 V500 H556 V488 H536
    V542 H556 V518 H616 V586 H556 V574 H536 V680 Z"/>

  <!-- Rampen: Pfeil zeigt abwärts. Die westliche genaue Lage ist unbestätigt. -->
  <path id="ramp-entry" d="M512 637 V603 M504 611 L512 603 L520 611"
        fill="none" stroke="#c7a14a" stroke-width="3"/>
  <path id="ramp-east" d="M554 324 H594 M586 316 L594 324 L586 332"
        fill="none" stroke="#c7a14a" stroke-width="3"/>
  <path id="ramp-west-uncertain" d="M470 324 H430 M438 316 L430 324 L438 332"
        fill="none" stroke="#c7a14a" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- E: Eingang / Ausgang. -->
  <circle id="entrance" cx="512" cy="659" r="17" fill="#17130d" stroke="#c7a14a" stroke-width="2"/>
  <text x="512" y="666" text-anchor="middle" font-size="22">E</text>

  <!-- Suchmarker: bewusst keine Behauptung einer festen Bossposition. -->
  <circle id="boss-1-search" cx="512" cy="400" r="18" fill="#17130d" stroke="#c7a14a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="512" y="407" text-anchor="middle" font-size="22">1</text>
  <circle id="boss-2-search" cx="646" cy="258" r="18" fill="#17130d" stroke="#c7a14a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="646" y="265" text-anchor="middle" font-size="22">2</text>

  <!-- Räumlich zugeordnete Bosse. -->
  <circle id="boss-3" cx="844" cy="324" r="20" fill="#17130d" stroke="#c7a14a" stroke-width="2"/>
  <text x="844" y="332" text-anchor="middle" font-size="24">3</text>
  <circle id="boss-4" cx="937" cy="324" r="17" fill="#17130d" stroke="#c7a14a" stroke-width="2"/>
  <text x="937" y="331" text-anchor="middle" font-size="22">4</text>
  <circle id="boss-5" cx="87" cy="324" r="17" fill="#17130d" stroke="#c7a14a" stroke-width="2"/>
  <text x="87" y="331" text-anchor="middle" font-size="22">5</text>
  <text x="937" y="286" text-anchor="middle" font-size="18">Q1</text>
  <text x="87" y="286" text-anchor="middle" font-size="18">Q2</text>

  <!-- Hinweise stehen außerhalb der begehbaren Geometrie. -->


  <!-- Legende am unteren Kartenrand. -->
  <path d="M48 710 H976" fill="none" stroke="#c7a14a"/>




  <circle cx="554" cy="785" r="17" fill="none" stroke="#c7a14a" stroke-width="2"/>
  <text x="554" y="792" text-anchor="middle" font-size="21">4</text>

  <circle cx="554" cy="850" r="17" fill="none" stroke="#c7a14a" stroke-width="2"/>
  <text x="554" y="857" text-anchor="middle" font-size="21">5</text>

  <circle cx="554" cy="915" r="17" fill="none" stroke="#c7a14a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="554" y="922" text-anchor="middle" font-size="21">6</text>

  <path d="M48 964 H976" fill="none" stroke="#c7a14a"/>
</svg>
